capabilities:
  eyebrow: Core Engine Architecture
  title: Built for disk, memory, and hybrid retrieval
  text: vchord pairs SIGMOD'24 RaBitQ quantization with PostgreSQL's native page storage, WAL, and buffer manager.
  items:
    - ref: 01 / VCHORDRQ · DISK-FRIENDLY IVF
      title: Scale to 100M+ vectors on SSD
      url: /docs/vchord/usage/indexing/
      motto: Hierarchical K-Means + RaBitQ 4/8-bit Quantization
      bullets:
        - 'Compresses 32-bit vectors by **8×–32×** with bounded distance error'
        - 'Keeps centroids in RAM and streams posting lists from SSD via async I/O'
        - 'Supports external centroid and IVF precomputation with zero database CPU contention'
      value: Scale to hundreds of millions of vectors on a 32 GB PostgreSQL node.
      visual:
        type: code
        aria_label: Create a disk-friendly vchordrq index with hierarchical K-Means
        title: vchordrq.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Enable vchord (auto-loads pgvector)' }
          - { class: k, prefix: '', text: 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;' }
          - { class: c, prefix: '-- ', text: 'Build a hierarchical RaBitQ index' }
          - { class: k, prefix: '', text: 'CREATE INDEX items_emb_idx ON items' }
          - { class: k, prefix: '  ', text: 'USING vchordrq (embedding vector_l2_ops)' }
          - { class: v, prefix: '  ', text: 'WITH (options = $$' }
          - { class: v, prefix: '    ', text: 'residual_quantization = true' }
          - { class: v, prefix: '    ', text: '[build.internal]' }
          - { class: v, prefix: '    ', text: 'lists = [4096]' }
          - { class: v, prefix: '  ', text: '$$);' }
    - ref: 02 / VCHORDG · HIGH-QPS GRAPH
      title: Fast graph search without bloat
      url: /docs/vchord/usage/graph-index/
      motto: Single-layer RaBitQ graph index for low-latency search
      bullets:
        - 'Delivers **2×–5× higher QPS** and lower p99 latency than HNSW'
        - 'Reduces index size by **50%** and builds **4× faster** than HNSW'
        - 'Supports `vector`, `halfvec`, `rabitq8`, and `rabitq4` single-vector types'
      value: Use vchordg when your working set fits in memory and requires maximum QPS.
      visual:
        type: code
        aria_label: Create a high-QPS vchordg graph index
        title: vchordg.sql
        lines:
          - { class: c, prefix: '-- ', text: 'High-QPS graph index with 2-bit RaBitQ' }
          - { class: k, prefix: '', text: 'CREATE INDEX items_graph_idx ON items' }
          - { class: k, prefix: '  ', text: 'USING vchordg (embedding vector_ip_ops)' }
          - { class: v, prefix: '  ', text: 'WITH (options = $$' }
          - { class: v, prefix: '    ', text: 'm = 32' }
          - { class: v, prefix: '    ', text: 'ef_construction = 64' }
          - { class: v, prefix: '    ', text: 'alpha = [1.0, 1.2]' }
          - { class: v, prefix: '    ', text: 'bits = 2' }
          - { class: v, prefix: '  ', text: '$$);' }
    - ref: 03 / MAXSIM · MULTI-VECTOR RETRIEVAL
      title: Native ColBERT & ColPali in SQL
      url: /docs/vchord/usage/multi-vector-retrieval/
      motto: Native vector[] indexing with WARP dynamic pruning
      bullets:
        - 'Indexes `vector[]` token-level embeddings with the `@#` (`MaxSim`) operator'
        - 'Applies **WARP** pruning over RaBitQ centroids to skip non-matching tokens'
        - 'Runs **ColPali** visual document search and **ColBERTv2** reranking in SQL'
      value: Improve multi-vector retrieval accuracy by up to 70% without external rerankers.
      visual:
        type: code
        aria_label: Multi-vector MaxSim query in SQL
        title: maxsim_colbert.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Store per-token embeddings as vector(128)[]' }
          - { class: k, prefix: '', text: 'CREATE TABLE docs (id bigserial, embs vector(128)[]);' }
          - { class: k, prefix: '', text: 'CREATE INDEX ON docs USING vchordrq (embs vector_maxsim_ops)' }
          - { class: v, prefix: '  ', text: 'WITH (options = $$ [build.internal] lists = [1000] $$);' }
          - { class: c, prefix: '-- ', text: 'Query with the MaxSim (@#) operator' }
          - { class: k, prefix: '', text: 'SELECT id FROM docs' }
          - { class: k, prefix: '  ', text: 'ORDER BY embs @# ARRAY[''[0.1, ...]'']::vector[]' }
          - { class: k, prefix: '  ', text: 'LIMIT 10;' }
    - ref: 04 / VCHORD SUITE · HYBRID SEARCH
      title: Unified hybrid search in PostgreSQL
      url: /docs/bm25/
      motto: Combine vchord, vchord_bm25, and pg_tokenizer in SQL
      bullets:
        - '**`vchord` (`1.5.0`)**: RaBitQ disk-friendly IVF with filter keys, single-layer graph, and MaxSim indexes'
        - '**`vchord_bm25` (`1.3.0`)**: Native `tsvector` Okapi BM25 index with Block-WeakAnd pruning'
        - '**`pg_tokenizer` (`1.3.0`)**: In-database multilingual text analyzers and vocabulary models'
      value: Combine relational filters, dense or multi-vector similarity, and BM25 in one SQL query.
      visual:
        type: code
        aria_label: Hybrid vector and BM25 search in SQL
        title: hybrid_search.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Enable vector search & BM25 lexical ranking' }
          - { class: k, prefix: '', text: 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;' }
          - { class: k, prefix: '', text: 'CREATE EXTENSION IF NOT EXISTS vchord_bm25 CASCADE;' }
          - { class: c, prefix: '-- ', text: 'Index dense vectors and native tsvector lexemes' }
          - { class: k, prefix: '', text: 'CREATE INDEX docs_vec_idx ON docs USING vchordrq (emb vector_l2_ops);' }
          - { class: k, prefix: '', text: 'CREATE INDEX docs_bm25_idx ON docs USING bm25 (tsv bm25_ops);' }
          - { class: c, prefix: '-- ', text: 'Query with Block-WeakAnd BM25 (<&>) ranking' }
          - { class: k, prefix: '', text: 'SELECT id, tsv <&> to_bm25query(to_tsvector(''english'', ''postgres vector''), ''docs_bm25_idx'') AS score' }
          - { class: k, prefix: '  ', text: 'FROM docs ORDER BY score LIMIT 10;' }

suite:
  eyebrow: Documentation Sections
  title: Explore the complete Vchord documentation
  desc: Reference documentation for the three PGSTY-maintained core extensions (vchord, vchord_bm25, pg_tokenizer), predecessor archives, and the upstream pgvector foundation.
  columns: 3
  items:
    - title: vchord Documentation
      meta: Core Vector Engine · v1.5.0
      icon: fa-solid fa-layer-group
      class: td-landing-card--core
      desc: Disk-friendly PostgreSQL vector search extension powered by RaBitQ quantization, providing vchordrq IVF indexes, vchordg graph indexes, and MaxSim.
      url: /docs/vchord/
    - title: vchord_bm25 Documentation
      meta: Native BM25 Ranking Index · v1.3.0
      icon: fa-solid fa-magnifying-glass
      class: td-landing-card--core
      desc: Native Okapi BM25 ranking extension for PostgreSQL tsvector columns using Block-WeakAnd Top-K pruning, built to pair with vchord for hybrid search.
      url: /docs/bm25/
    - title: pg_tokenizer Documentation
      meta: Multilingual & LLM Vocabularies · v1.3.0
      icon: fa-solid fa-language
      class: td-landing-card--core
      desc: In-database multilingual text analyzer and tokenization pipeline supporting Jieba, Lindera, Snowball stemmers, LLM vocabularies, and custom models.
      url: /docs/tokenizer/
    - title: pgvecto.rs Documentation
      meta: Predecessor Reference Manual
      icon: fa-solid fa-cube
      class: td-landing-card--deprecated
      desc: First-generation Rust vector search extension (v0.1–v0.4) succeeded by vchord. Preserved as a historical reference and migration guide.
      url: /docs/vectors/
    - title: pg_bestmatch Documentation
      meta: Predecessor Reference Manual
      icon: fa-solid fa-ranking-star
      class: td-landing-card--deprecated
      desc: Early BM25 sparse-vector generator succeeded by vchord_bm25 and pg_tokenizer. Preserved for existing sparsevec and svector users.
      url: /docs/bestmatch/
    - title: pgvector Documentation
      meta: Required Upstream Extension
      icon: fa-solid fa-circle-nodes
      class: td-landing-card--upstream
      desc: Foundational upstream PostgreSQL extension (`0.8.7`) required by vchord, providing vector, halfvec, bit, and sparsevec types, operators, and HNSW.
      url: /docs/vector/

steps:
  eyebrow: Quick Start
  title: Run vchord in three steps
  desc: Install native packages with Pigsty or download a GitHub release, preload the shared library, and build your first vector index.
  items:
    - icon: fa-solid fa-download
      title: Install extension packages
      desc: "Install `vchord` (and `pgvector`) on Linux with the [`pig`](https://pig.pgsty.com/) CLI, or download `1.5.0` packages from [GitHub Releases](/docs/vchord/getting-started/installation/)."
      cmd:
        code: pig repo add pgsql -u && pig ext add vchord
    - icon: fa-solid fa-plug
      title: Preload & enable vchord
      desc: "Add `vchord.so` to `shared_preload_libraries` and restart PostgreSQL, then run `CREATE EXTENSION` (`CASCADE` loads `pgvector`)."
      cmd:
        code: psql -U postgres -c "CREATE EXTENSION IF NOT EXISTS vchord CASCADE;"
    - icon: fa-solid fa-magnifying-glass-chart
      title: Create index & query
      desc: "Create a `vchordrq` or `vchordg` index on your `vector` column and query with `<->`, `<#>`, `<=>`, or `@#`."
      cmd:
        code: psql -U postgres -c "CREATE INDEX ON items USING vchordrq (emb vector_l2_ops);"

faq:
  eyebrow: Frequently Asked Questions
  title: Understanding the Vchord Suite & PGSTY Maintenance
  flat: true
  items:
    - question: Why does PGSTY maintain the Vchord suite?
      answer: >-
        **TensorChord Inc.**, the original creator of `VectorChord`, `VectorChord-bm25`, and `pg_tokenizer.rs`,
        closed operations and stopped active upstream maintenance. At the request of the original authors,
        **[PGSTY](https://pigsty.io/)** assumed maintenance of all three extensions —
        [`pgsty/vchord`](https://github.com/pgsty/vchord), [`pgsty/vchord_bm25`](https://github.com/pgsty/vchord_bm25),
        and [`pgsty/pg_tokenizer`](https://github.com/pgsty/pg_tokenizer) — to keep them reliable for PostgreSQL users.
    - question: What are PGSTY's maintenance scope, release baseline, and security policy?
      answer: >-
        PGSTY maintains **`vchord` (`1.5.0`)**, **`vchord_bm25` (`1.3.0`)**, and **`pg_tokenizer` (`1.3.0`)**
        on **`pgrx 0.20`** for **PostgreSQL 15–19** (`x86_64` and `aarch64`).
        Source tags and Linux release artifacts are published on GitHub, and GPG-signed RPM and DEB packages are distributed across
        [16 Linux OS and CPU targets](/download/) with full dependency inventories in the [SBOM](/docs/about/sbom/).
        PGSTY focuses on stability, correctness, and packaging rather than new feature commitments; report bugs and security issues on
        [GitHub Issues](https://github.com/pgsty/vchord/issues).
    - question: Which licenses apply, and can existing installations upgrade in place?
      answer: >-
        [`vchord`](https://github.com/pgsty/vchord) and [`vchord_bm25`](https://github.com/pgsty/vchord_bm25) use the
        [**GNU AGPL v3.0**](/docs/about/license/) license, and [`pg_tokenizer`](https://github.com/pgsty/pg_tokenizer) uses
        **Apache-2.0**. `vchord 1.5.0`, `vchord_bm25 1.3.0` (within `1.x`), and `pg_tokenizer 1.3.0`
        provide in-place `ALTER EXTENSION ... UPDATE` scripts on PostgreSQL 15–19. Upgrading `vchord_bm25` from legacy `0.3.x` (`bm25vector`) to `1.x` (`tsvector`)
        requires following the [BM25 Migration Guide](/docs/bm25/reference/migration/). See [Attribution & Provenance](/docs/about/attribution/).
    - question: How does vchord relate to pgvector and pgvecto.rs?
      answer: >-
        **`vchord`** replaces [`pgvecto.rs`](/docs/vectors/) and builds on SIGMOD'24 **RaBitQ** quantization,
        PostgreSQL native buffer pages, and WAL replication. Unlike `pgvecto.rs`, `vchord` uses `pgvector`'s standard
        `vector` and `halfvec` types and `<->`, `<#>`, and `<=>` operators directly, so existing `pgvector` queries work without SQL rewrites
        after creating a `vchordrq` or `vchordg` index. See the [Migration Guide](/docs/vchord/admin/migration/).
    - question: When should I choose vchordrq versus vchordg?
      answer: >-
        Choose **`vchordrq`** (RaBitQ Inverted File) for large datasets (1M to 100M+ vectors), SSD-backed storage,
        high write throughput, multi-vector `vector[]` (`@#` MaxSim) search, or external index builds.
        Choose **`vchordg`** (RaBitQ Graph) for single-vector (`vector`, `halfvec`, `rabitq8`, `rabitq4`) workloads that fit in memory
        and require high QPS and low tail latency without HNSW memory overhead. Compare both in the [Indexing Guide](/docs/vchord/usage/indexing/).
    - question: How do vchord, vchord_bm25, and pg_tokenizer work together?
      answer: >-
        [`pg_tokenizer`](/docs/tokenizer/) converts multilingual text into native `tsvector` lexemes or `INT[]` token IDs,
        [`vchord_bm25`](/docs/bm25/) scores and prunes `tsvector` documents with Block-WeakAnd Okapi BM25 (`<&>`), and
        [`vchord`](/docs/vchord/) executes dense (`vchordrq` / `vchordg`) or multi-vector (`@#` MaxSim) similarity search —
        combined in one SQL query with Reciprocal Rank Fusion (RRF) or reranking.

