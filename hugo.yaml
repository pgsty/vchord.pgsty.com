#=======================================#
# Basics
#=======================================#
baseURL: https://vchord.pgsty.com/
title: Vchord - Scalable Vector & BM25 Search for PostgreSQL
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true
capitalizeListTitles: false
timeZone: UTC

pagination:
  pagerSize: 20

frontmatter:
  lastmod:
    - lastmod
    - ":git"
    - date
    - publishDate

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.168.0"
  imports:
    - path: github.com/pgsty/oink

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: Vchord
    params:
      description: "Scalable, fast, and disk-friendly vector & BM25 search for PostgreSQL — successor to pgvecto.rs, maintained by Pigsty."
      upstream_copyright: "© 2023–Present TensorChord Inc."
      ui:
        command_palette:
          commands:
            - id: quick_start
              title: Quick Start
              description: Launch vchord with Docker or PostgreSQL packages in minutes
              url: /docs/getting-started/overview/
              icon: fa-solid fa-bolt
              keywords: [start, quickstart, docker, install, vchord, vchordrq]
            - id: indexing_guide
              title: Indexing Guide
              description: Choose between vchordrq (disk-friendly RaBitQ IVF) and vchordg (high-QPS graph)
              url: /docs/usage/indexing/
              icon: fa-solid fa-layer-group
              keywords: [index, vchordrq, vchordg, rabitq, kmeans]
            - id: reference_api
              title: Quantization & SQL Types
              description: RaBitQ4/RaBitQ8 types, operators, index options, and GUC parameters
              url: /docs/usage/quantization-types/
              icon: fa-solid fa-terminal
              keywords: [reference, sql, guc, operators, parameters, rabitq]
            - id: bm25_docs
              title: vchord_bm25 Documentation
              description: Native Okapi BM25 ranking index and Block-WeakAnd Top-K search
              url: /docs/bm25/
              icon: fa-solid fa-magnifying-glass
              keywords: [bm25, vchord_bm25, full-text, search, hybrid]
            - id: tokenizer_docs
              title: pg_tokenizer Documentation
              description: Multilingual text analyzers, stemmers, custom models, Jieba, and Lindera
              url: /docs/tokenizer/
              icon: fa-solid fa-language
              keywords: [pg_tokenizer, tokenizer, jieba, lindera, stemmer]
            - id: vectors_docs
              title: pgvecto.rs Documentation
              description: Complete documentation archive for pgvecto.rs (vectors extension)
              url: /docs/vectors/
              icon: fa-solid fa-cube
              keywords: [pgvecto.rs, vectors, legacy, archive]
            - id: benchmark_results
              title: Benchmarks
              description: Cost, recall, QPS, and index build time across 1M to 100M vectors
              url: /docs/benchmark/performance/
              icon: fa-solid fa-chart-line
              keywords: [benchmark, performance, qps, recall, cost]
    menu:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 10
          params:
            icon: fa-solid fa-book
        - identifier: docs-vchord
          parent: docs
          name: vchord
          pageRef: /docs
          weight: 10
          params:
            icon: fa-solid fa-layer-group
            description: Scalable vector search with vchordrq, vchordg, and MaxSim
        - identifier: docs-bm25
          parent: docs
          name: vchord_bm25
          pageRef: /docs/bm25
          weight: 20
          params:
            icon: fa-solid fa-magnifying-glass
            description: Native Okapi BM25 ranking index and Block-WeakAnd search
        - identifier: docs-tokenizer
          parent: docs
          name: pg_tokenizer
          pageRef: /docs/tokenizer
          weight: 30
          params:
            icon: fa-solid fa-language
            description: Multilingual text analyzers, stemmers, and custom models
        - identifier: docs-vectors
          parent: docs
          name: pgvecto.rs
          pageRef: /docs/vectors
          weight: 40
          params:
            icon: fa-solid fa-cube
            description: Complete documentation archive for pgvecto.rs (vectors)
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 20
          params:
            icon: fa-solid fa-blog
        - identifier: blog-post
          parent: blog
          name: Engineering & Deep Dives
          pageRef: /blog/post
          weight: 10
          params:
            icon: fa-solid fa-compass-drafting
            description: RaBitQ quantization, billion-scale benchmarks, BM25, and ColBERT
        - identifier: blog-release
