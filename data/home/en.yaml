capabilities:
  eyebrow: Core Engine Architecture
  title: Designed for disk, memory, and hybrid retrieval
  text: VectorChord pairs SIGMOD'24 RaBitQ quantization with PostgreSQL's native storage, WAL, and buffer manager.
  items:
    - ref: 01 / VCHORDRQ · DISK-FRIENDLY IVF
      title: Store 100M+ vectors without exhausting RAM
      url: /docs/usage/indexing/
      motto: Hierarchical K-Means + RaBitQ 4-bit / 8-bit Quantization
      bullets:
        - 'Compresses 32-bit float vectors by **8× to 32×** with mathematically bounded distance estimation error'
        - 'Only compact centroids stay in memory; quantized inverted lists stream from SSD with `io_uring` / `posix_fadvise` prefetching'
        - 'Supports external multi-node or GPU index precomputation for 100M+ vectors with zero production CPU contention'
      value: Scale to hundreds of millions of vectors on a 32 GB PostgreSQL node.
      visual:
        type: code
        aria_label: Create a disk-friendly vchordrq index with hierarchical K-Means
        title: vchordrq.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Enable VectorChord (auto-loads pgvector)' }
          - { class: k, prefix: '', text: 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;' }
          - { class: c, prefix: '-- ', text: 'Build a hierarchical RaBitQ index' }
          - { class: k, prefix: '', text: 'CREATE INDEX items_emb_idx ON items' }
          - { class: k, prefix: '  ', text: 'USING vchordrq (embedding vector_l2_ops)' }
          - { class: v, prefix: '  ', text: 'WITH (options = $$' }
          - { class: v, prefix: '    ', text: 'residual_quantization = true' }
          - { class: v, prefix: '    ', text: '[build.internal]' }
          - { class: v, prefix: '    ', text: 'lists = [4096]' }
          - { class: v, prefix: '  ', text: '$$);' }
    - ref: 02 / VCHORDG · HIGH-QPS GRAPH
      title: Low-latency graph search without HNSW bloat
      url: /docs/usage/indexing/
      motto: Single-layer RaBitQ graph index for latency-critical workloads
      bullets:
        - 'Eliminates multi-layer HNSW memory overhead while delivering **2×–5× higher QPS** and lower p99 latency'
        - 'Up to **50% smaller index footprint** and **4× faster index construction** than `pgvector` HNSW'
        - 'First-class support for `vector`, `halfvec`, and `vector[]` multi-vector embeddings'
      value: Drop-in replacement when your working set fits in memory and QPS is paramount.
      visual:
        type: code
        aria_label: Create a high-QPS vchordg graph index
        title: vchordg.sql
        lines:
          - { class: c, prefix: '-- ', text: 'High-QPS graph index with RaBitQ8' }
          - { class: k, prefix: '', text: 'CREATE INDEX items_graph_idx ON items' }
          - { class: k, prefix: '  ', text: 'USING vchordg (embedding vector_ip_ops)' }
          - { class: v, prefix: '  ', text: 'WITH (options = $$' }
          - { class: v, prefix: '    ', text: 'm = 32' }
          - { class: v, prefix: '    ', text: 'ef_construction = 64' }
          - { class: v, prefix: '    ', text: ' alpha = [1.0, 1.2]' }
          - { class: v, prefix: '    ', text: 'bits = 8' }
          - { class: v, prefix: '  ', text: '$$);' }
    - ref: 03 / MAXSIM · MULTI-VECTOR COLBERT
      title: Late-interaction ColBERT & ColPali in SQL
      url: /docs/usage/multi-vector-retrieval/
      motto: Native vector[] indexing with WARP dynamic pruning
      bullets:
        - 'First PostgreSQL extension to natively index `vector[]` token-level document embeddings with `@#` (`MaxSim`)'
        - 'Implements **WARP** (Web-scale Accelerated Residual Pruning) over RaBitQ centroids to skip irrelevant token comparisons'
        - 'Powers multimodal PDF/visual document retrieval with **ColPali** and fine-grained text retrieval with **ColBERTv2**'
      value: Up to 70% higher retrieval accuracy on complex domain queries without external reranking clusters.
      visual:
        type: code
        aria_label: Multi-vector MaxSim query in SQL
        title: maxsim_colbert.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Store per-token embeddings as vector(128)[]' }
          - { class: k, prefix: '', text: 'CREATE TABLE docs (id bigserial, embs vector(128)[]);' }
          - { class: k, prefix: '', text: 'CREATE INDEX ON docs USING vchordrq (embs vector_maxsim_ops)' }
          - { class: v, prefix: '  ', text: 'WITH (options = $$ [build.internal] lists = [1000] $$);' }
          - { class: c, prefix: '-- ', text: 'Query with the MaxSim (@#) operator' }
          - { class: k, prefix: '', text: 'SELECT id FROM docs' }
          - { class: k, prefix: '  ', text: 'ORDER BY embs @# ARRAY[''[0.1, ...]'']::vector[]' }
          - { class: k, prefix: '  ', text: 'LIMIT 10;' }
    - ref: 04 / HYBRID SEARCH · BM25 + RRF
      title: Complete retrieval suite inside PostgreSQL
      url: /docs/use-case/hybrid-search/
      motto: Combine VectorChord, VectorChord-bm25, and pg_tokenizer.rs
      bullets:
        - '**VectorChord-bm25**: Block-WeakAnd (WAND) BM25 inverted index delivering 3× faster lexical top-K than ParadeDB'
        - '**pg_tokenizer.rs**: multilingual tokenizers (BERT, HuggingFace, Lindera Japanese, Jieba Chinese, Snowball)'
        - 'Fuse dense semantic search and BM25 keyword scores in one SQL query via Reciprocal Rank Fusion (RRF) or ColBERT reranking'
      value: Keep relational data, vector search, and full-text BM25 in one transactional database.
      visual:
        type: components
        aria_label: VectorChord retrieval ecosystem components
        columns: 2
        items:
          - { icon: fa-solid fa-layer-group, title: VectorChord, detail: vchordrq · vchordg · MaxSim, url: /docs/getting-started/overview/ }
          - { icon: fa-solid fa-magnifying-glass, title: VectorChord-bm25, detail: Block-WAND BM25 index, url: /docs/use-case/hybrid-search/ }
          - { icon: fa-solid fa-language, title: pg_tokenizer.rs, detail: Multilingual & LLM tokenizers, url: /docs/use-case/hybrid-search/ }
          - { icon: fa-solid fa-database, title: pgvector Types, detail: vector & halfvec compatible, url: /docs/getting-started/overview/ }
          - { icon: fa-solid fa-cloud, title: VectorChord Cloud, detail: Managed cluster reference, url: /cloud/ }
          - { icon: fa-solid fa-cube, title: pgvecto.rs, detail: Legacy docs & migration path, url: /pgvecto-rs/ }

