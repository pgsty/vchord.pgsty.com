hero:
  eyebrow: 为 PostgreSQL 而生的可扩展向量检索
  title_lines:
    - PGSTY VCHORD
  title_size: 4.0rem
  lead: '磁盘友好型 RaBitQ 向量检索（`vchord`）、原生 BM25 全文排序（`vchord_bm25`）与多语言分词（`pg_tokenizer`），兼容 `pgvector` 生态。'
  note: 'vchord 1.5.0 · vchord_bm25 1.3.0 · pg_tokenizer 1.3.0 · PostgreSQL 15–19 · [AGPL-3.0](/zh/docs/about/license/)'
  image:
    light: img/vchord-architecture-light.svg
    dark: img/vchord-architecture-dark.svg
    alt: >-
      Vchord 架构图：PostgreSQL 的 vector、vector[] 与 tsvector 类型经由
      RaBitQ 4-bit/8-bit 量化与 Block-WeakAnd 流入 vchordrq、vchordg 与 bm25 原生索引引擎。
  media:
    ratio: 1.24fr 0.76fr
    max_width: 440px
    hide_below: lg
  actions:
    - label: 快速开始
      url: /docs/vchord/getting-started/overview/
      icon: fa-solid fa-rocket
      style: primary
    - label: 安装部署
      url: /docs/vchord/getting-started/installation/
      icon: fa-solid fa-download
      style: ghost
    - label: 基准测试
      url: /docs/vchord/benchmark/performance/
      icon: fa-solid fa-chart-line
      style: ghost
  detail:
    label: 了解 vchord 1.5.0 新特性
    url: /release/vchord-1.5.0/

