hero:
  eyebrow: vchord 1.3.0 · PostgreSQL 14–18 · Successor to pgvecto.rs
  title_lines:
    - Scalable Vector Search
    - Built for PostgreSQL
  title_size: 3.6rem
  lead: >-
    Powered by RaBitQ 4/8-bit quantization, disk-friendly IVF (`vchordrq`),
    high-QPS graphs (`vchordg`), MaxSim search, and `pgvector` compatibility.
  note: 'Forked from [VectorChord](https://github.com/tensorchord/VectorChord), created by [TensorChord](https://github.com/tensorchord), and now maintained by [PGSTY](https://pgsty.com/) · [AGPL-3.0](/docs/about/license/)'
  image:
    light: img/vchord-architecture-light.svg
    dark: img/vchord-architecture-dark.svg
    alt: >-
      Vchord architecture: PostgreSQL vector, vector[], and tsvector types flow through
      RaBitQ 4-bit/8-bit quantization and Block-WeakAnd into vchordrq, vchordg, and bm25 native index engines.
  media:
    ratio: 1.24fr 0.76fr
    max_width: 440px
    hide_below: lg
  actions:
    - label: Get Started
      url: /docs/vchord/getting-started/overview/
      icon: fa-solid fa-rocket
      style: primary
    - label: Installation
      url: /docs/vchord/getting-started/installation/
      icon: fa-solid fa-download
      style: ghost
    - label: Benchmarks
      url: /docs/vchord/benchmark/performance/
      icon: fa-solid fa-chart-line
      style: ghost
  detail:
    label: What's new in vchord 1.3
    url: /blog/release/vchord-1.3.0/

