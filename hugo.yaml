          name: Release Notes
          pageRef: /blog/release
          weight: 20
          params:
            icon: fa-solid fa-tag
            description: Version announcements for vchord and pgvecto.rs
        - identifier: pigsty
          name: Pigsty
          weight: 60
          url: https://pigsty.io
          params:
            icon: fa-solid fa-database
        - identifier: github
          name: GitHub
          weight: 70
