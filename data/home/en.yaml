capabilities:
  eyebrow: Core Engine Architecture
  title: Designed for disk, memory, and hybrid retrieval
  text: vchord pairs SIGMOD'24 RaBitQ quantization with PostgreSQL's native storage, WAL, and buffer manager.
  items:
    - ref: 01 / VCHORDRQ · DISK-FRIENDLY IVF
      title: Scale to 100M+ vectors on SSD
      url: /docs/vchord/usage/indexing/
      motto: Hierarchical K-Means + RaBitQ 4/8-bit Quantization
      bullets:
        - 'Compresses 32-bit vectors by **8×–32×** with bounded error'
        - 'Keeps only centroids in RAM; streams lists from SSD via async I/O'
        - 'Supports multi-node or GPU external build with zero CPU contention'
      value: Scale to hundreds of millions of vectors on a 32 GB node.
      visual:
        type: code
        aria_label: Create a disk-friendly vchordrq index with hierarchical K-Means
        title: vchordrq.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Enable vchord (auto-loads pgvector)' }
          - { class: k, prefix: '', text: 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;' }
          - { class: c, prefix: '-- ', text: 'Build a hierarchical RaBitQ index' }
          - { class: k, prefix: '', text: 'CREATE INDEX items_emb_idx ON items' }
          - { class: k, prefix: '  ', text: 'USING vchordrq (embedding vector_l2_ops)' }
          - { class: v, prefix: '  ', text: 'WITH (options = $$' }
          - { class: v, prefix: '    ', text: 'residual_quantization = true' }
          - { class: v, prefix: '    ', text: '[build.internal]' }
          - { class: v, prefix: '    ', text: 'lists = [4096]' }
          - { class: v, prefix: '  ', text: '$$);' }
    - ref: 02 / VCHORDG · HIGH-QPS GRAPH
      title: Fast graph search without bloat
      url: /docs/vchord/usage/indexing/
      motto: Single-layer RaBitQ graph index for low-latency search
      bullets:
        - 'Delivers **2×–5× higher QPS** and lower p99 latency than HNSW'
        - '**50% smaller index footprint** and **4× faster build** than HNSW'
        - 'Native support for `vector`, `halfvec`, and `vector[]` types'
      value: Drop-in graph index when your working set fits in memory.
      visual:
        type: code
        aria_label: Create a high-QPS vchordg graph index
        title: vchordg.sql
        lines:
          - { class: c, prefix: '-- ', text: 'High-QPS graph index with RaBitQ8' }
          - { class: k, prefix: '', text: 'CREATE INDEX items_graph_idx ON items' }
          - { class: k, prefix: '  ', text: 'USING vchordg (embedding vector_ip_ops)' }
          - { class: v, prefix: '  ', text: 'WITH (options = $$' }
          - { class: v, prefix: '    ', text: 'm = 32' }
          - { class: v, prefix: '    ', text: 'ef_construction = 64' }
          - { class: v, prefix: '    ', text: 'alpha = [1.0, 1.2]' }
          - { class: v, prefix: '    ', text: 'bits = 8' }
          - { class: v, prefix: '  ', text: '$$);' }
    - ref: 03 / MAXSIM · MULTI-VECTOR RETRIEVAL
      title: Native ColBERT & ColPali in SQL
      url: /docs/vchord/usage/multi-vector-retrieval/
      motto: Native vector[] indexing with WARP dynamic pruning
      bullets:
        - 'Indexes `vector[]` token-level embeddings with `@#` (`MaxSim`)'
        - 'Uses **WARP** over RaBitQ centroids to prune token comparisons'
        - 'Powers **ColPali** visual retrieval and **ColBERTv2** reranking'
      value: Up to 70% higher accuracy without external rerank clusters.
      visual:
        type: code
        aria_label: Multi-vector MaxSim query in SQL
        title: maxsim_colbert.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Store per-token embeddings as vector(128)[]' }
          - { class: k, prefix: '', text: 'CREATE TABLE docs (id bigserial, embs vector(128)[]);' }
          - { class: k, prefix: '', text: 'CREATE INDEX ON docs USING vchordrq (embs vector_maxsim_ops)' }
          - { class: v, prefix: '  ', text: 'WITH (options = $$ [build.internal] lists = [1000] $$);' }
          - { class: c, prefix: '-- ', text: 'Query with the MaxSim (@#) operator' }
          - { class: k, prefix: '', text: 'SELECT id FROM docs' }
          - { class: k, prefix: '  ', text: 'ORDER BY embs @# ARRAY[''[0.1, ...]'']::vector[]' }
          - { class: k, prefix: '  ', text: 'LIMIT 10;' }
    - ref: 04 / VCHORD SUITE · HYBRID SEARCH
      title: Unified hybrid search in Postgres
      url: /docs/bm25/
      motto: Combine vchord, vchord_bm25, and pg_tokenizer in SQL
      bullets:
        - '**`vchord`**: RaBitQ disk-friendly IVF and high-QPS graph indexes'
        - '**`vchord_bm25`**: Block-WeakAnd BM25 index, 3× faster than ParadeDB'
        - '**`pg_tokenizer`**: In-database multilingual and LLM tokenizers'
      value: Unify relational data, vector search, and BM25 in one database.
      visual:
        type: code
        aria_label: Hybrid vector and BM25 search in SQL
        title: hybrid_search.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Enable vector search & BM25 lexical ranking' }
          - { class: k, prefix: '', text: 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;' }
          - { class: k, prefix: '', text: 'CREATE EXTENSION IF NOT EXISTS vchord_bm25 CASCADE;' }
          - { class: c, prefix: '-- ', text: 'Index both dense vectors and BM25 tokens' }
          - { class: k, prefix: '', text: 'CREATE INDEX docs_vec_idx ON docs USING vchordrq (emb vector_l2_ops);' }
          - { class: k, prefix: '', text: 'CREATE INDEX docs_bm25_idx ON docs USING bm25 (tsv bm25_ops);' }
          - { class: c, prefix: '-- ', text: 'Query with Block-WeakAnd BM25 (<&>) ranking' }
          - { class: k, prefix: '', text: 'SELECT id, tsv <&> to_bm25query(''postgres vector'', ''docs_bm25_idx'') AS score' }
          - { class: k, prefix: '  ', text: 'FROM docs ORDER BY score LIMIT 10;' }

suite:
  eyebrow: Documentation Sections
  title: Explore the complete Vchord documentation
  desc: Complete documentation for the three PGSTY-maintained core extensions (vchord, vchord_bm25, pg_tokenizer), predecessor archives, and the upstream pgvector foundation.
  columns: 3
  items:
    - title: vchord Documentation
      meta: Core Vector Engine · v1.3.0
      icon: fa-solid fa-layer-group
      class: td-landing-card--core
      desc: Core disk-friendly PostgreSQL vector search extension powered by RaBitQ quantization, featuring vchordrq IVF indexes, vchordg graph indexes, and MaxSim.
      url: /docs/vchord/
    - title: vchord_bm25 Documentation
      meta: Native BM25 Ranking Index · v1.0.0
      icon: fa-solid fa-magnifying-glass
      class: td-landing-card--core
      desc: Core native Okapi BM25 ranking extension for PostgreSQL using Block-WeakAnd Top-K index pruning, designed to pair with vchord for hybrid search in SQL.
      url: /docs/bm25/
    - title: pg_tokenizer Documentation
      meta: Multilingual & LLM Vocabularies · v1.0.0
      icon: fa-solid fa-language
      class: td-landing-card--core
      desc: Core in-database multilingual text analyzer and tokenization pipeline supporting Jieba, Lindera, Snowball stemmers, LLM vocabularies, and custom models.
      url: /docs/tokenizer/
    - title: pgvecto.rs Documentation
      meta: Predecessor Reference Manual
      icon: fa-solid fa-cube
      class: td-landing-card--deprecated
      desc: First-generation Rust vector search extension (v0.1–v0.4) succeeded by vchord. Preserved as a complete historical reference and step-by-step migration guide.
      url: /docs/vectors/
    - title: pg_bestmatch Documentation
      meta: Predecessor Reference Manual
      icon: fa-solid fa-ranking-star
      class: td-landing-card--deprecated
      desc: Early BM25 sparse-vector generator succeeded by vchord_bm25 and pg_tokenizer. Preserved for existing sparsevec/svector users and historical reference.
      url: /docs/bestmatch/
    - title: pgvector Documentation
      meta: Required Upstream Extension
      icon: fa-solid fa-circle-nodes
      class: td-landing-card--upstream
      desc: Foundational upstream PostgreSQL extension that vchord builds upon, providing standard vector, halfvec, bit, and sparsevec types, operators, and HNSW.
      url: /docs/vector/

steps:
  eyebrow: Quick Start
  title: Run vchord in three steps
  desc: Start a local container or install native packages via Pigsty, enable the extension, and run your first similarity search.
  items:
    - icon: fa-brands fa-docker
      title: Docker example (Obsolete)
      desc: "**Obsolete — pending updates and maintenance.** PGSTY Docker images are not yet available. The upstream example is retained for reference; use [Pigsty packages](/docs/vchord/getting-started/installation/) for current releases."
      cmd:
        code: docker run -d -p 5432:5432 -e POSTGRES_PASSWORD=postgres tensorchord/vchord-postgres:pg18-v1.1.1
    - icon: fa-solid fa-plug
      title: Enable the extension
      desc: Connect with `psql` and enable `vchord` (`CASCADE` loads `pgvector` automatically).
      cmd:
        code: psql -h 127.0.0.1 -U postgres -c "CREATE EXTENSION IF NOT EXISTS vchord CASCADE;"
    - icon: fa-solid fa-magnifying-glass-chart
      title: Create index & query
      desc: Build a `vchordrq` index on your `vector` column and query with `<->`, `<#>`, or `<=>`.
      cmd:
        code: psql -h 127.0.0.1 -U postgres -c "CREATE INDEX ON items USING vchordrq (emb vector_l2_ops);"

faq:
  eyebrow: Frequently Asked Questions
  title: Understanding the Vchord Suite & PGSTY Maintenance
  flat: true
  items:
    - question: Why is the PGSTY community maintaining the Vchord suite?
      answer: >-
        **TensorChord Inc.**, the company that created `VectorChord`, `VectorChord-bm25`, and `pg_tokenizer.rs`,
        has wound down operations and ceased active maintenance. At the request of the original authors,
        the **[PGSTY](https://pigsty.io/)** community stepped in to take over stewardship of all three
        extensions—[`pgsty/vchord`](https://github.com/pgsty/vchord), [`pgsty/vchord_bm25`](https://github.com/pgsty/vchord_bm25),
        and [`pgsty/pg_tokenizer`](https://github.com/pgsty/pg_tokenizer)—so the PostgreSQL community can continue relying on them.
    - question: What is PGSTY's maintenance scope, roadmap, and security policy?
      answer: >-
        PGSTY maintains open-source supply-chain continuity, testing and packaging **`vchord` (`v1.3.0`)**, **`vchord_bm25` (`v1.0.0`)**,
        and **`pg_tokenizer` (`v1.0.0`)** on a unified **`pgrx 0.19.3`** baseline for **PostgreSQL 14–18**. Pre-built native RPM and DEB
        packages are published across [16 mainstream Linux OS and CPU targets](/download/), with dependency and license inventories documented
        in the [SBOM](/docs/about/sbom/). We do **not** commit to developing new features—roadmap items will be handled on a best-effort basis
        as maintainer capacity allows—but **security vulnerabilities and critical bug reports are always welcome** via [GitHub Issues](https://github.com/pgsty/vchord/issues).
    - question: What license is the Vchord suite under, and is it drop-in compatible?
      answer: >-
        [`vchord`](https://github.com/pgsty/vchord) and [`vchord_bm25`](https://github.com/pgsty/vchord_bm25) are distributed under the
        [**GNU AGPL v3.0**](/docs/about/license/) license, while [`pg_tokenizer`](https://github.com/pgsty/pg_tokenizer) is distributed under
        **Apache-2.0**. `vchord 1.3.0` and `pg_tokenizer 1.0.0` provide in-place `ALTER EXTENSION ... UPDATE` scripts from earlier releases,
        while `vchord_bm25 1.0.0` uses native `tsvector` and requires following the [migration guide](/docs/bm25/reference/migration/) from 0.3.x.
        See [Attribution & Provenance](/docs/about/attribution/).
    - question: How does vchord relate to pgvector and pgvecto.rs?
      answer: >-
        **`vchord`** is the next-generation successor to [`pgvecto.rs`](/docs/vectors/), redesigned around SIGMOD'24 **RaBitQ**
        quantization and PostgreSQL's native page storage and WAL replication. Unlike `pgvecto.rs`, `vchord` uses `pgvector`'s
        standard `vector` and `halfvec` types and `<->`, `<#>`, `<=>` operators directly—so existing `pgvector` applications
        can switch indexes (`USING vchordrq` or `USING vchordg`) without rewriting queries. See the [Migration Guide](/docs/vchord/admin/migration/).
    - question: When should I choose vchordrq versus vchordg?
      answer: >-
        Choose **`vchordrq`** (RaBitQ Inverted File) for large datasets (1M to 100M+ vectors), cost-sensitive deployments,
        high insert/update throughput, or when your vectors exceed available RAM. Choose **`vchordg`** (RaBitQ Graph) when
        your dataset fits comfortably in memory and you need maximum QPS and ultra-low single-query latency without HNSW's
        multi-layer memory overhead. Compare both in the [Indexing Guide](/docs/vchord/usage/indexing/).
    - question: How do vchord, vchord_bm25, and pg_tokenizer work together?
      answer: >-
        [`pg_tokenizer`](/docs/tokenizer/) segments multilingual or English text into `INT[]` token IDs, legacy `bm25vector` values, or native `tsvector` values,
        [`vchord_bm25`](/docs/bm25/) executes fast Block-WeakAnd Okapi BM25 Top-K lexical ranking (`<&>`), and [`vchord`](/docs/)
        provides dense (`vchordrq`/`vchordg`) and multi-vector ColBERT (`@#` MaxSim) semantic search—fused inside a single SQL query via RRF.

