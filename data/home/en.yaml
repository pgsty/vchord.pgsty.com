hero:
  eyebrow: Scalable Vector Search Built for PostgreSQL
  title_lines:
    - PGSTY VCHORD
  title_size: 4.0rem
  lead: >-
    Disk-friendly RaBitQ vector search (`vchord`), native Okapi BM25 ranking (`vchord_bm25`),
    and multilingual tokenization (`pg_tokenizer`) — compatible with `pgvector`.
  note: 'vchord 1.5.0 · vchord_bm25 1.3.0 · pg_tokenizer 1.3.0 · PostgreSQL 15–19 · [AGPL-3.0](/docs/about/license/)'
  image:
    light: img/vchord-architecture-light.svg
    dark: img/vchord-architecture-dark.svg
    alt: >-
      Vchord architecture: PostgreSQL vector, vector[], and tsvector types flow through
      RaBitQ 4-bit/8-bit quantization and Block-WeakAnd into vchordrq, vchordg, and bm25 native index engines.
  media:
    ratio: 1.24fr 0.76fr
    max_width: 440px
    hide_below: lg
  actions:
    - label: Get Started
      url: /docs/vchord/getting-started/overview/
      icon: fa-solid fa-rocket
      style: primary
    - label: Installation
      url: /docs/vchord/getting-started/installation/
      icon: fa-solid fa-download
      style: ghost
    - label: Benchmarks
      url: /docs/vchord/benchmark/performance/
      icon: fa-solid fa-chart-line
      style: ghost
  detail:
    label: What is new in vchord 1.5.0
    url: /release/vchord-1.5.0/

