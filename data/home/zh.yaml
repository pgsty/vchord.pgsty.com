      url: /docs/vectors/

steps:
  eyebrow: 快速上手
  title: 三步运行 vchord
  desc: 启动本地容器或通过 Pigsty 安装原生软件包，启用扩展，即可执行你的第一次向量相似度检索。
  items:
    - icon: fa-brands fa-docker
      title: 启动内置 vchord 的 PostgreSQL
      desc: 运行预构建的 Docker 镜像（已内置 `vchord` 与 `pgvector`），或通过 [Pigsty / 原生软件包](/zh/docs/getting-started/installation/)安装。
      cmd:
        code: docker run -d --name vchord -e POSTGRES_PASSWORD=postgres -p 5432:5432 tensorchord/vchord-postgres:pg18-v1.1.1
    - icon: fa-solid fa-plug
      title: 启用扩展
      desc: 使用 `psql` 连接数据库并启用 `vchord`（`CASCADE` 会自动启用 `vector` 扩展）。
      cmd:
        code: psql -h 127.0.0.1 -U postgres -c "CREATE EXTENSION IF NOT EXISTS vchord CASCADE;"
    - icon: fa-solid fa-magnifying-glass-chart
      title: 创建 vchordrq 索引并执行查询
      desc: 在 `vector` 或 `halfvec` 列上使用 `vchordrq` 创建索引，并使用标准的 `<->`、`<#>` 或 `<=>` 操作符进行检索。
      cmd:
        code: psql -h 127.0.0.1 -U postgres -c "CREATE INDEX ON items USING vchordrq (embedding vector_l2_ops);"

faq:
  eyebrow: 常见问题
  title: 了解 Vchord 家族与 pgsty/vchord
  flat: true
  items:
    - question: vchord 与 pgvector、pgvecto.rs 是什么关系？
      answer: >-
        **`vchord`** 是 [`pgvecto.rs`](/zh/docs/vectors/) 的下一代架构继任者，围绕 SIGMOD'24 **RaBitQ** 量化算法以及
        PostgreSQL 原生页面存储与 WAL 复制机制重新设计。不同于 `pgvecto.rs`，`vchord` 直接复用 `pgvector` 标准的
        `vector` 和 `halfvec` 数据类型以及 `<->`、`<#>`、`<=>` 操作符，因此现有的 `pgvector` 应用只需切换索引访问方法
        （`USING vchordrq` 或 `USING vchordg`），无需改写业务查询语句。详见[迁移指南](/zh/docs/admin/migration/)。
      open: true
    - question: 什么时候应该选择 vchordrq，什么时候选择 vchordg？
      answer: >-
        对于大规模数据集（100 万至 1 亿+ 向量）、成本敏感型部署、高写入/更新吞吐场景，或当向量规模超出可用内存时，
        请选择 **`vchordrq`**（RaBitQ 倒排文件索引）。当工作集可以轻松放入内存，且你需要极致的 QPS 与极低的单次查询延迟、
        同时希望避免 HNSW 多层图结构的内存膨胀时，请选择 **`vchordg`**（RaBitQ 图索引）。两者详细对比请参阅[索引指南](/zh/docs/usage/indexing/)。
    - question: 什么是 RaBitQ？为什么 vchord 1.1 新增了 RaBitQ8？
      answer: >-
        **RaBitQ**（随机比特量化）可将 32 位浮点向量压缩为紧凑的 4-bit（`bits = 4`，默认）或
        8-bit（`bits = 8`）表示，具备严格的理论误差上界，并支持硬件加速的 SIMD 内积估计。4-bit RaBitQ 已能满足绝大多数场景，
        而 **RaBitQ8** 针对高度聚集或分布极度偏斜的向量数据集，在重排序前即可提供近乎无损的距离估计精度。欢迎阅读
        [RaBitQ 与 IVF 深度解析](/zh/blog/post/vectorchord-store-400k-vectors-for-1-in-postgresql/)。
    - question: 为什么 Pigsty 社区要维护 Vchord 扩展家族？
      answer: >-
        [`pgsty/vchord`](https://github.com/pgsty/vchord)、[`pgsty/vchord_bm25`](https://github.com/pgsty/vchord_bm25)、
        [`pgsty/pg_tokenizer`](https://github.com/pgsty/pg_tokenizer) 与 `vchord.pgsty.com` 由 [Pigsty](https://pigsty.cc/) 社区维护，
        旨在保障该项目的长期开源连续性，为 Enterprise Linux、Debian 与 Ubuntu 上的 PostgreSQL 13–18 提供可复现的 RPM/DEB 软件包，
        并提供完整、快速、本地优先的中英双语技术文档与工程文章归档。详见[署名与来源说明](/zh/docs/about/attribution/)。

