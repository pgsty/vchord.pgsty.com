steps:
  eyebrow: Quick Start
  title: Run VectorChord in three steps
  desc: Start a local container or install native packages via Pigsty, enable the extension, and run your first similarity search.
  items:
    - icon: fa-brands fa-docker
      title: Start PostgreSQL with VectorChord
      desc: Launch the prebuilt Docker image (includes both `vchord` and `pgvector`), or install via [Pigsty / packages](/docs/getting-started/installation/).
      cmd:
        code: docker run -d --name vchord -e POSTGRES_PASSWORD=postgres -p 5432:5432 tensorchord/vchord-postgres:pg18-v1.1.1
    - icon: fa-solid fa-plug
      title: Enable the extension
      desc: Connect with `psql` and enable `vchord` (`CASCADE` automatically enables `vector`).
      cmd:
        code: psql -h 127.0.0.1 -U postgres -c "CREATE EXTENSION IF NOT EXISTS vchord CASCADE;"
    - icon: fa-solid fa-magnifying-glass-chart
      title: Create a vchordrq index & query
      desc: Index your `vector` or `halfvec` column using `vchordrq` and query with standard `<->`, `<#>`, or `<=>` operators.
      cmd:
        code: psql -h 127.0.0.1 -U postgres -c "CREATE INDEX ON items USING vchordrq (embedding vector_l2_ops);"

faq:
  eyebrow: Frequently Asked Questions
  title: Understanding VectorChord & pgsty/vchord
  flat: true
  items:
    - question: How does VectorChord relate to pgvector and pgvecto.rs?
      answer: >-
        **VectorChord** is the next-generation successor to [`pgvecto.rs`](/pgvecto-rs/),
        redesigned around SIGMOD'24 **RaBitQ** quantization and PostgreSQL's native page storage
        and WAL replication. Unlike `pgvecto.rs`, VectorChord uses `pgvector`'s standard `vector`
        and `halfvec` data types and `<->`, `<#>`, `<=>` operators directly, so existing `pgvector`
        applications can switch indexes (`USING vchordrq` or `USING vchordg`) without rewriting queries.
        See the [Migration Guide](/docs/admin/migration/).
      open: true
    - question: When should I choose vchordrq versus vchordg?
      answer: >-
        Choose **`vchordrq`** (RaBitQ Inverted File) for large datasets (1M to 100M+ vectors),
        cost-sensitive deployments, high insert/update throughput, or when your vectors exceed available RAM.
        Choose **`vchordg`** (RaBitQ Graph) when your dataset fits comfortably in memory and you need
        maximum QPS and ultra-low single-query latency without HNSW's multi-layer memory overhead.
        Compare both in the [Indexing Guide](/docs/usage/indexing/).
    - question: What is RaBitQ, and why is RaBitQ8 added in VectorChord 1.1?
      answer: >-
        **RaBitQ** (Randomized Bit Quantization) compresses 32-bit floating-point vectors into compact
        4-bit (`bits = 4`, default) or 8-bit (`bits = 8`) representations with a sharp theoretical
        error bound and hardware-accelerated SIMD inner-product estimation. While 4-bit RaBitQ is
        ideal for most workloads, **RaBitQ8** provides near-lossless accuracy before reranking for
        tightly clustered or highly skewed vector distributions. Read the [RaBitQ & IVF deep dive](/blog/post/vectorchord-store-400k-vectors-for-1-in-postgresql/).
    - question: Why did Pigsty fork VectorChord as pgsty/vchord?
      answer: >-
        [`pgsty/vchord`](https://github.com/pgsty/vchord) and `vchord.pgsty.com` are maintained by the
        [Pigsty](https://pigsty.io/) community to ensure long-term open-source continuity, reproducible
        RPM/DEB packaging across PostgreSQL 13–18 on Enterprise Linux, Debian, and Ubuntu, and a complete,
        fast, local-first documentation and engineering archive. See [Attribution](/about/attribution/).

