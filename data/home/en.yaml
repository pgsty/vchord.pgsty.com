hero:
  eyebrow: VectorChord 1.1.1 · PostgreSQL 13–18 · Successor to pgvecto.rs
  title_lines:
    - Scalable Vector Search
    - Built for PostgreSQL
  title_size: 3.6rem
  lead: >-
    Store 400,000 vectors per $1 and index 100 million vectors in 20 minutes.
    Powered by RaBitQ 4-bit/8-bit quantization, disk-friendly IVF (`vchordrq`),
    high-QPS graphs (`vchordg`), MaxSim multi-vector retrieval, and native `pgvector` compatibility.
  note: Forked from tensorchord/VectorChord · Maintained by Pigsty · Dual-licensed Apache-2.0 / AGPL-3.0
  image:
    light: img/vchord-architecture-light.svg
    dark: img/vchord-architecture-dark.svg
    alt: >-
      VectorChord architecture: PostgreSQL vector, vector[], and bm25vector types flow through
      RaBitQ 4-bit/8-bit quantization into vchordrq, vchordg, and bm25 native index engines.
  media:
    ratio: 1.18fr 0.82fr
    max_width: 440px
    hide_below: lg
  actions:
    - label: Get Started
      url: /docs/getting-started/overview/
      icon: fa-solid fa-rocket
      style: primary
    - label: Installation
      url: /docs/getting-started/installation/
      icon: fa-solid fa-download
      style: ghost
    - label: Benchmarks
      url: /docs/benchmark/performance/
      icon: fa-solid fa-chart-line
      style: ghost
  detail:
    label: What's new in VectorChord 1.1
    url: /blog/release/vectorchord-11-native-48-bit-vector-types-and-per-index-query-defaults/

